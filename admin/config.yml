{
  "backend": {
    "name": "github",
    "repo": "ricechickengames/sarah-kostuk-portfolio",
    "branch": "main",
    "base_url": "https://sarah-kostuk-portfolio.pages.dev",
    "auth_endpoint": "auth"
  },
  "media_folder": "assets/uploads",
  "public_folder": "/assets/uploads",
  "site_url": "https://sarah-kostuk-portfolio.pages.dev",
  "display_url": "https://sarah-kostuk-portfolio.pages.dev",
  "logo_url": "/assets/studio-logo.svg",
  "collections": [
    {
      "name": "portfolio",
      "label": "Your portfolio",
      "files": [
        {
          "name": "portfolio",
          "label": "Pages & folder photos",
          "file": "content/portfolio.json",
          "format": "json",
          "fields": [
            {
              "name": "categories",
              "label": "Project folders",
              "widget": "list",
              "allow_add": false,
              "min": 3,
              "max": 3,
              "summary": "{{fields.title}}",
              "fields": [
                {
                  "name": "id",
                  "widget": "hidden"
                },
                {
                  "label": "Folder title",
                  "name": "title",
                  "widget": "string"
                },
                {
                  "label": "Short description",
                  "name": "description",
                  "widget": "text"
                },
                {
                  "label": "Page content",
                  "name": "body",
                  "widget": "text"
                },
                {
                  "label": "Folder photos & media",
                  "name": "photos",
                  "widget": "list",
                  "min": 4,
                  "max": 6,
                  "summary": "{{fields.label}}",
                  "fields": [
                    {
                      "label": "Media type",
                      "name": "type",
                      "widget": "select",
                      "required": false,
                      "default": "auto",
                      "options": [
                        {
                          "label": "Detect automatically",
                          "value": "auto"
                        },
                        {
                          "label": "Photo",
                          "value": "image"
                        },
                        {
                          "label": "Video",
                          "value": "video"
                        },
                        {
                          "label": "Audio",
                          "value": "audio"
                        }
                      ]
                    },
                    {
                      "label": "Photo, video, or audio file",
                      "name": "src",
                      "widget": "file",
                      "hint": "Upload a photo, MP4/WebM video, or MP3/WAV audio. Keep each file below 25 MiB."
                    },
                    {
                      "label": "Media title",
                      "name": "label",
                      "widget": "string",
                      "required": false
                    },
                    {
                      "label": "Horizontal crop (%)",
                      "name": "x",
                      "widget": "number",
                      "value_type": "int",
                      "min": 0,
                      "max": 100,
                      "default": 50
                    },
                    {
                      "label": "Vertical crop (%)",
                      "name": "y",
                      "widget": "number",
                      "value_type": "int",
                      "min": 0,
                      "max": 100,
                      "default": 50
                    }
                  ]
                },
                {
                  "label": "Project attachments",
                  "name": "files",
                  "widget": "list",
                  "required": false,
                  "fields": [
                    {
                      "label": "Display name",
                      "name": "name",
                      "widget": "string"
                    },
                    {
                      "label": "File",
                      "name": "src",
                      "widget": "file"
                    }
                  ]
                }
              ]
            },
            {
              "label": "About page text",
              "name": "about",
              "widget": "text"
            },
            {
              "label": "Contact page text",
              "name": "contact",
              "widget": "text"
            },
            {
              "label": "Contact email",
              "name": "email",
              "widget": "string",
              "required": false
            }
          ]
        }
      ]
    }
  ]
}